version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cims_user
      POSTGRES_PASSWORD: cims_secure_password_123
      POSTGRES_DB: cims_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cims_user -d cims_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cims-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cims_user:cims_secure_password_123@db:5432/cims_db
      SECRET_KEY: cims_super_secret_jwt_production_key_987654321_hex
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      PROJECT_NAME: "College Internship Management System"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    command: >
      sh -c "python -m backend.app.seed.seed_data &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cims-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
